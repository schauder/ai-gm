# Digital Game Master AI Prompts

# Prompt for handling player actions during gameplay
prompt.inProgress=Here is what the players want to do:\n===\n{input}\n===\n\nDescribe what happens to the players.

# Prompt for creating the basic plot outline
prompt.createPlot=You are a dungeon master! You are going to play a single shot adventure with one player.\nPlease create the basic plot outline for an adventure dealing with {input}

# Prompt for describing the initial scene
prompt.initialScene=You are a dungeon master! You are going to play a single shot adventure with one player.\n\nThis is the basic plot outline you have:\n===\n{basic_plot}\n===\n\nDescribe the initial scene to the players.

